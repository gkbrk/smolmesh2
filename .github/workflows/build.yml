name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, osx-arm64, win-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: >
          dotnet publish dotnet/Smolmesh/Smolmesh.csproj -c Release -r ${{ matrix.rid }}
          --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded -o out
      - if: matrix.rid == 'win-x64'
        run: |
          curl -fsSL https://www.wintun.net/builds/wintun-0.14.1.zip -o "$RUNNER_TEMP/wintun.zip"
          echo "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51  $RUNNER_TEMP/wintun.zip" | sha256sum -c -
          unzip -j "$RUNNER_TEMP/wintun.zip" wintun/bin/amd64/wintun.dll -d out
      - uses: actions/upload-artifact@v4
        with:
          name: smolmesh-${{ matrix.rid }}
          path: out/

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          cd artifacts
          for d in smolmesh-*; do (cd "$d" && chmod +x smolmesh* && zip -qr "../$d.zip" .); done
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest artifacts/*.zip --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" --notes "Automatic build of ${GITHUB_SHA::7}"
